<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Neuron Explorer</title>
<link rel="stylesheet" href="style.css?v=72">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <nav id="views" class="seg" role="tablist" aria-label="Explorer view">
    <button id="view-map-tab" data-view="map" class="on" role="tab" aria-controls="map-view" aria-selected="true">map</button>
    <button id="view-embed-tab" data-view="embed" role="tab" aria-controls="embed-view" aria-selected="false" tabindex="-1">embeddings</button>
  </nav>
  <select id="layer" aria-label="layer"></select>
  <span class="seg" id="layout-mode" title="sheet layout"><button data-k="index">index</button><button data-k="writes" class="on">writes</button></span>
  <span class="seg" id="web-mode" title="connection web of the focused neuron: upstream and downstream cones; yellow links push the reader up, magenta push it down"><button data-w="off">no web</button><button data-w="on" class="on">web</button></span><input id="web-z" value="5" inputmode="numeric" aria-label="web top links" title="web: the open neuron's top links each way">
  <input id="jump" placeholder="L22 N2742" aria-label="go to neuron" spellcheck="false">
  <span class="seg" id="q-mode"><button data-q="lens" class="on">lens</button><button data-q="fires">fires</button></span>
  <input id="lens-q" placeholder="search lens" aria-label="search" spellcheck="false" autocomplete="off">
  <span id="status" class="mono" role="status" aria-live="polite"></span>
</header>

<main>
  <section id="map-view" class="view on" role="tabpanel" aria-labelledby="view-map-tab">
    <canvas id="map"></canvas>
    <div id="layer-labels"></div>
    <button id="layer-back"></button>
  </section>
  <section id="embed-view" class="view" role="tabpanel" aria-labelledby="view-embed-tab">
    <canvas id="scatter"></canvas>
    <div id="embed-empty" class="slot"></div>
    <div id="embed-bar">
      <span class="seg" id="color-by">
        <button data-c="neuron" class="on">neuron</button><button data-c="prompt">prompt</button><button data-c="dose">dose</button><button data-c="kind">kind</button>
      </span>
    </div>
    <div id="tip" class="float"></div>
  </section>

  <aside id="list" class="float">
    <div id="focus-head">
      <div class="id-line"><span id="f-id" class="mono"></span><span id="f-rank" class="mono dim"></span><button id="f-close" aria-label="close neuron">×</button></div>
      <textarea id="f-name" rows="1" placeholder="name" spellcheck="false" aria-label="feature name"></textarea>
    </div>
    <nav id="ltabs" aria-label="Neuron analysis"><button data-lt="net" class="on" title="Neuron connections and lens search">Connections</button><button data-lt="run" title="Run text and inspect neuron activations">Activations</button><button id="list-hide" class="edge" aria-label="hide list">‹</button></nav>
    <div id="lt-net" class="lpane on">
      <div id="net"></div>
      <div id="list-head">
        <input id="filter" placeholder="filter" spellcheck="false" aria-label="filter by word or name">
        <label class="dim"><input type="checkbox" id="show-random"> random</label>
      </div>
      <ol id="rows" class="rows"></ol>
    </div>
    <div id="lt-run" class="lpane">
      <textarea id="inf-text" rows="6" placeholder="Paste text to see which neurons fire on each token…" aria-label="Text to analyze" spellcheck="false"></textarea>
      <div id="infer">
        <div id="inf-toks"></div>
        <div id="inf-filters">
          <span class="lab">L</span><input id="inf-lo" value="0" inputmode="numeric" aria-label="from layer"><span class="lab">–</span><input id="inf-hi" value="31" inputmode="numeric" aria-label="to layer">
          <span class="seg" id="inf-sign"><button data-s="both" class="on">±</button><button data-s="+">+</button><button data-s="-">−</button></span>
          <span class="lab">≥</span><input id="inf-min" value="1.0" inputmode="decimal" aria-label="minimum score">
          <input id="inf-q" placeholder="lens has…" aria-label="lens filter" spellcheck="false">
        </div>
      </div>
      <ol id="run-rows" class="rows"></ol>
    </div>
  </aside>

  <button id="list-tab" class="tab-edge left" aria-label="show list">›</button>
  <button id="focus-tab" class="tab-edge right mono" aria-label="show neuron"></button>
  <aside id="focus" class="float">
    <nav id="tabs" aria-label="Inspector"><button data-tab="agent" class="on">Assistant</button><button data-tab="chat">Chat</button><button data-tab="details">Details</button><button data-tab="examples">Examples</button><button id="f-collapse" class="edge" aria-label="collapse inspector">›</button></nav>
    <div id="tab-examples" class="tab"></div>
    <div id="tab-chat" class="tab">
      <div id="c-lens"></div>
      <p id="c-empty" class="slot">Send a prompt to compare this neuron's positive dose, baseline, and opposite dose. Chat runs on the local Qwen model.</p>
      <div id="c-thread"></div>
      <div id="c-reads"></div>
      <div id="c-error" class="err" role="status" aria-live="polite"></div>
      <form id="c-form">
        <div id="chat-controls">
          <span class="seg" id="c-mode" aria-label="Steering mode"><button type="button" data-m="add" class="on" title="Add a dose along this neuron's writing direction">add</button><button type="button" data-m="mul" aria-label="Multiply activation" title="Multiply this neuron's activation">×</button></span>
          <span class="seg" id="c-dir" aria-label="Chat direction"><button type="button" data-d="writes" class="on" title="Generate replies while steering this neuron">writes</button><button type="button" data-d="reads" title="Measure this neuron's activation on your text">reads you</button></span>
          <span class="stepper"><button type="button" id="c-minus" aria-label="smaller">−</button><input id="c-dose" class="mono" inputmode="decimal" aria-label="dose" title="Finite dose; negative values and zero are supported" value="0.8"><button type="button" id="c-plus" aria-label="larger">+</button></span>
          <button type="button" id="c-clear" class="dim" title="Clear this neuron's Chat history and reading result">clear</button>
        </div>
        <div class="row"><input id="c-input" placeholder="Who are you?" aria-label="Neuron Chat prompt" autocomplete="off" required><button id="c-go" type="submit">run</button></div>
      </form>
    </div>
    <div id="tab-details" class="tab"></div>
    <div id="tab-agent" class="tab on">
      <div id="a-provider-controls">
        <label class="sr-only" for="a-provider">Assistant provider</label>
        <select id="a-provider" aria-label="Assistant provider" title="Choose an assistant. Codex and Claude keep separate conversations."><option value="codex">Codex</option><option value="claude">Claude</option></select>
        <div id="a-access-controls">
          <label for="a-access">File access</label>
          <select id="a-access" aria-label="Assistant file access" title="Files the assistant can read or edit. Project + home also allows access to your home folder; shell commands still require approval."><option value="project">Project only</option><option value="home">Project + home folder</option></select>
        </div>
        <div class="a-header-actions"><button id="a-history-toggle" type="button" aria-label="Past chats" title="Past chats" aria-expanded="false" aria-controls="a-history"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg></button>
        <button id="a-new" type="button" title="Start a new conversation with the selected assistant"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>New chat</span></button></div>
      </div>
      <div id="a-history" aria-label="Past chats" hidden></div>
      <div id="a-thread"><div class="a-empty dim">Ask anything about the model, or open a neuron and press <b>explain</b>.</div></div>
      <div id="a-actions"></div>
      <div id="a-files"></div>
      <form id="a-form"><button id="a-attach" type="button" title="Attach files (or drop / paste them)" aria-label="Attach files"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 11 5-5a2.1 2.1 0 0 1 3 3l-6.5 6.5a3.5 3.5 0 0 1-5-5l7-7"/></svg></button><input id="a-file" type="file" multiple hidden><textarea id="a-input" rows="1" placeholder="Ask the assistant…" aria-label="Assistant message" title="Enter sends; Shift+Enter adds a line. While working, Enter interrupts and Ctrl+Enter queues." spellcheck="false"></textarea><button id="a-send" type="submit" aria-label="send">↑</button></form>
    </div>
  </aside>
</main>
<script type="module" src="app.js?v=upstream-107"></script>
</body>
</html>
