<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <script>
      // Tailwind recommends applying the saved class in the head to avoid a theme flash.
      try {
        const saved = localStorage.getItem("neuron-explorer-theme");
        const theme = saved === "light" || saved === "dark" || saved === "system" ? saved : "light";
        const resolved = theme === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
        document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#252525" : "#ffffff";
      } catch {}
    </script>
    <title>Neuron Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
